<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — ORION OPTIMIZER</title>
  <link rel="icon" type="image/jpeg" href="/assets/icon.jpeg">
  <script src="/assets/cookies.js"></script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner">
    <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"><img src="/assets/icon.jpeg" alt=""></span>ORION<span class="accent">OPTIMIZER</span></a>
    <div class="nav-actions" data-nav-actions></div>
  </div></nav>

  <div class="page-wrap">
    <div class="auth-wrap">
      <div id="mode-label">
        <h2>Acessar conta</h2>
        <p class="sub">Informe sua chave de licença para acessar.</p>
      </div>

      <form id="auth-form">
        <div class="field">
          <label for="key">Chave de licença</label>
          <input type="text" id="key" required autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="29" spellcheck="false" style="font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.08em">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Acessar</button>
      </form>

      <p class="auth-switch">Não tem uma licença? <a href="/planos">Adquira agora</a>.</p>
    </div>
  </div>

  <script src="/assets/app.js" type="text/plain" data-consent></script>
  <script src="/assets/effects.js" type="text/plain" data-consent></script>
  <script type="text/plain" data-consent>
    const form = document.getElementById('auth-form');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.textContent = 'Aguarde...';
      const key = document.getElementById('key').value.trim().toUpperCase();
      try {
        if (!key || key.length < 10) throw new Error('Informe uma chave de licença válida.');
        const res = await API.post('/api/v1/store/login-key', { key });
        setToken(res.token);
        if (res.license) localStorage.setItem('orion_last_key', res.license.key);
        toast('Bem-vindo!', 'ok');
        location.href = (new URLSearchParams(location.search).get('next')) || '/conta';
      } catch (err) {
        toast(err.message || 'Falha de autenticação.', 'err');
        btn.disabled = false; btn.textContent = 'Acessar';
      }
    });
  </script>
</body>
</html>
