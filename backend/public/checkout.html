<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — ORION OPTIMIZER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <nav class="nav"><div class="nav-inner">
    <a href="/" class="brand"><span class="brand-mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="6"/><path d="M12 9v3l2 2"/></svg></span>ORION<span class="accent">OPTIMIZER</span></a>
    <div class="nav-actions" data-nav-actions></div>
  </div></nav>

  <div class="page-wrap">
  <div class="container auth-wrap" style="max-width:760px">
      <h2>Finalizar compra</h2>
      <p class="sub">Revise seu pedido e escolha como pagar.</p>

      <div id="checkout-body">
        <div class="skeleton" style="height:240px"></div>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    const planSlug = new URLSearchParams(location.search).get('plan') || 'pro';
    let plan = null;
    let appliedCoupon = null; // { code, discountPercent }

    (async () => {
      if (!isAuthed()) {
        location.href = '/login?next=' + encodeURIComponent('/checkout?plan=' + planSlug);
        return;
      }
      try {
        const { plans } = await API.get('/api/v1/public/plans');
        plan = plans.find(p => p.slug === planSlug);
        if (!plan) throw new Error('Plano não encontrado.');
        renderOrder();
      } catch (e) {
        toast(e.message, 'err');
      }
    })();

    function discounted() {
      const base = Number(plan.price || 0);
      const pct = appliedCoupon ? appliedCoupon.discountPercent : 0;
      const final = Math.round(base * (1 - pct / 100) * 100) / 100;
      return final;
    }

    function renderOrder() {
      document.getElementById('checkout-body').innerHTML = `
        <div class="summary">
          <div class="row"><span class="k">Plano</span><span>${plan.name}</span></div>
          <div class="row"><span class="k">Faturamento</span><span>Mensal</span></div>
          <div class="row">
            <span class="k">Total</span>
            <span id="sum-total">
              ${appliedCoupon ? `<span style="text-decoration:line-through;opacity:.55">${brl(plan.price)}</span> <b style="color:var(--green)">${brl(discounted())}</b>` : brl(plan.price)}
            </span>
          </div>
          ${appliedCoupon ? `<div class="row"><span class="k">Cupom</span><span class="muted" style="color:var(--green)">${appliedCoupon.code} (−${appliedCoupon.discountPercent}%)</span></div>` : ''}
        </div>
        <div class="coupon-box" style="margin-top:14px">
          <div class="muted" style="font-size:13px;margin-bottom:8px">Tem um cupom de desconto?</div>
          <div style="display:flex;gap:10px;align-items:center">
            <input id="coupon-input" type="text" placeholder="Ex.: BEMVINDO10" value="${appliedCoupon ? appliedCoupon.code : ''}" ${appliedCoupon ? 'disabled' : ''} style="flex:1;max-width:none">
            <button class="btn" id="coupon-btn" ${appliedCoupon ? 'disabled' : ''}>${appliedCoupon ? 'Aplicado' : 'Aplicar'}</button>
            ${appliedCoupon ? '<button class="btn btn-outline" id="coupon-clear">Remover</button>' : ''}
          </div>
          <div id="coupon-msg" class="muted" style="font-size:13px;margin-top:8px"></div>
        </div>
        <div class="methods">
          <label class="method">
            <input type="radio" name="method" value="pix" checked>
            <div><div class="lbl">PIX</div><div class="muted" style="font-size:13px">Pagamento instantâneo via QR Code</div></div>
          </label>
          <label class="method">
            <input type="radio" name="method" value="card">
            <div><div class="lbl">Cartão de crédito</div><div class="muted" style="font-size:13px">Você será redirecionado para o gateway</div></div>
          </label>
        </div>
        <button class="btn btn-primary btn-lg btn-block mt-2" id="pay-btn">${appliedCoupon ? 'Gerar pagamento com desconto' : 'Gerar pagamento'}</button>`;
      document.getElementById('pay-btn').addEventListener('click', startCheckout);
      if (document.getElementById('coupon-btn')) {
        document.getElementById('coupon-btn').addEventListener('click', applyCoupon);
        document.getElementById('coupon-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCoupon(); });
      }
      if (document.getElementById('coupon-clear')) {
        document.getElementById('coupon-clear').addEventListener('click', clearCoupon);
      }
    }

    async function applyCoupon() {
      const msg = document.getElementById('coupon-msg');
      const btn = document.getElementById('coupon-btn');
      const input = document.getElementById('coupon-input');
      const code = (input.value || '').trim().toUpperCase();
      msg.className = 'muted'; msg.textContent = 'Validando...';
      msg.style.fontSize = '13px'; msg.style.marginTop = '8px';
      if (!code) { msg.textContent = 'Informe um código de cupom.'; msg.style.color = 'var(--yellow)'; return; }
      btn.disabled = true;
      try {
        const res = await API.post('/api/v1/public/validate-coupon', { coupon: code });
        appliedCoupon = { code: res.coupon.code, discountPercent: res.coupon.discountPercent };
        msg.textContent = res.message;
        msg.style.color = 'var(--green)';
        renderOrder();
      } catch (err) {
        msg.textContent = err.message || 'Cupom inválido.';
        msg.style.color = 'var(--yellow)';
        btn.disabled = false;
      }
    }

    function clearCoupon() {
      appliedCoupon = null;
      renderOrder();
    }

    async function startCheckout() {
      const method = document.querySelector('input[name="method"]:checked').value;
      const btn = document.getElementById('pay-btn');
      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Gerando pagamento...';
      try {
        const res = await API.post('/api/v1/store/checkout', { plan: plan.slug, method, coupon: appliedCoupon ? appliedCoupon.code : undefined }, true);
        if (res.payment && res.payment.qr_code) {
          renderPix(res);
        } else if (res.payment && (res.payment.external_link || res.payment.checkoutUrl)) {
          location.href = res.payment.external_link || res.payment.checkoutUrl;
        } else {
          toast('Pagamento gerado. Acompanhe em Minha conta.', 'ok');
          setTimeout(() => location.href = '/conta', 1200);
        }
      } catch (err) {
        const msg = err.message || 'Não foi possível gerar o pagamento.';
        if (err.code === 'PAYMENT_NOT_CONFIGURED') {
          document.getElementById('checkout-body').innerHTML = `
            <div class="text-center muted" style="padding:20px 0">
              <h3 style="color:var(--yellow)">Pagamento temporariamente indisponível</h3>
              <p style="margin-top:8px">Estamos configurando o sistema de pagamento. Tente novamente mais tarde.</p>
              <a href="/planos" class="btn mt-2">Voltar aos planos</a>
            </div>`;
        } else if (err.code === 'RATE_LIMITED') {
          toast('Muitas tentativas. Aguarde um instante antes de tentar novamente.', 'err');
        } else {
          toast(msg, 'err');
        }
        btn.remove();
      }
    }

    function renderPix(res) {
      const p = res.payment;
      document.getElementById('checkout-body').innerHTML = `
        <div class="text-center">
          <h3>Pague com PIX</h3>
          <p class="dim">Escaneie o QR Code ou copie o código abaixo. Sua chave será liberada automaticamente.</p>
          <div style="background:#fff;border-radius:12px;padding:14px;margin:20px auto;max-width:260px">
            <img src="${p.qr_code}" style="width:100%;display:block" alt="QR Code PIX">
          </div>
          <button class="btn" id="copy-pix">Copiar código PIX</button>
          <div class="muted mt-1" style="font-size:13px">Valor: ${brl(res.order && res.order.amount != null ? res.order.amount : discounted())}</div>
          <p class="muted mt-2" style="font-size:13px">Pode demorar alguns segundos para confirmar. <a href="/conta">Acompanhe aqui</a>.</p>
          <input id="pix-copy-val" type="hidden" value="${p.qr_code_text || ''}">
        </div>`;
      document.getElementById('copy-pix').addEventListener('click', (e) => {
        const v = document.getElementById('pix-copy-val').value;
        navigator.clipboard.writeText(v).then(() => {
          e.target.textContent = 'Copiado!';
          setTimeout(() => (e.target.textContent = 'Copiar código PIX'), 1500);
        });
      });
    }
  </script>
</body>
</html>
